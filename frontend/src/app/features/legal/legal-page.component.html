<app-top-nav />

<div class="wrap">
  <app-back-button fallback="/" />
  <h1>{{ page.title }}</h1>
  <p class="updated">Dernière mise à jour : {{ page.updated }}</p>

  @for (s of page.sections; track s.heading) {
    <section>
      <h2>{{ s.heading }}</h2>
      @for (p of s.paragraphs; track p) {
        <p>{{ p }}</p>
      }
    </section>
  }
</div>

<app-site-footer />
