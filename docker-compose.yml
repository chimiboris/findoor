services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: findoor
      POSTGRES_USER: findoor
      POSTGRES_PASSWORD: findoor
    ports:
      - "5432:5432"
    volumes:
      - findoor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findoor"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - findoor_minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  findoor_postgres_data:
  findoor_minio_data:
