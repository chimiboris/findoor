spring.application.name=findoor-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/findoor
spring.datasource.username=findoor
spring.datasource.password=findoor
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

server.port=8081

management.endpoints.web.exposure.include=health,info
# Le mail (MailHog en dev, cf. docker-compose.yml) est optionnel : son indisponibilite
# ne doit pas faire tomber la sante globale de l'application.
management.health.mail.enabled=false

# Cle de developpement uniquement -- remplacee par une variable d'environnement en production.
findoor.jwt.secret=dev-only-change-me-findoor-secret-key-please-override-in-env-min-32-bytes
findoor.jwt.access-token-minutes=30
findoor.jwt.refresh-token-days=14

findoor.cors.allowed-origins=http://localhost:4200

findoor.storage.endpoint=http://localhost:9000
findoor.storage.bucket=findoor-media
findoor.storage.access-key=minioadmin
findoor.storage.secret-key=minioadmin

findoor.payment.provider=cinetpay
findoor.payment.cinetpay.site-id=CHANGE_ME
findoor.payment.cinetpay.api-key=CHANGE_ME
findoor.payment.cinetpay.notify-url=http://localhost:8081/api/paiements/webhook/cinetpay
findoor.payment.cinetpay.return-url=http://localhost:4200/proprietaire/annonces
