spring.application.name=findoor-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/findoor}
spring.datasource.username=${DATABASE_USERNAME:findoor}
spring.datasource.password=${DATABASE_PASSWORD:findoor}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Gmail SMTP réel (identifiants injectés par variables d'environnement — jamais en clair ici, voir
# GMAIL_USERNAME/GMAIL_APP_PASSWORD). Sans ces variables définies, l'envoi échoue proprement (voir
# EmailOtpSender/MessageService qui catchent déjà l'exception) plutôt que d'échouer silencieusement.
# Repli local : mettre localhost:1025 + MailHog (cf. scratchpad/mailhog.exe) si aucun compte Gmail n'est configuré.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

server.port=${PORT:8081}

management.endpoints.web.exposure.include=health,info
# Le mail (MailHog en dev, cf. docker-compose.yml) est optionnel : son indisponibilite
# ne doit pas faire tomber la sante globale de l'application.
management.health.mail.enabled=false

# Cle de developpement par defaut -- OBLIGATOIREMENT remplacee par la variable d'environnement
# JWT_SECRET en production (voir guide de deploiement).
findoor.jwt.secret=${JWT_SECRET:dev-only-change-me-findoor-secret-key-please-override-in-env-min-32-bytes}
findoor.jwt.access-token-minutes=30
findoor.jwt.refresh-token-days=14

findoor.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4300}

# Base du frontend, utilisée pour construire les liens dans les emails (digest d'alertes, désabonnement).
findoor.frontend-url=${FRONTEND_URL:http://localhost:4200}

findoor.storage.endpoint=http://localhost:9000
findoor.storage.bucket=findoor-media
findoor.storage.access-key=minioadmin
findoor.storage.secret-key=minioadmin
# Stockage local des photos d'annonces en attendant le bucket S3/MinIO (phase 4) -- cf. FileStorageService.
findoor.storage.local-dir=./uploads

findoor.payment.provider=cinetpay
findoor.payment.cinetpay.site-id=CHANGE_ME
findoor.payment.cinetpay.api-key=CHANGE_ME
findoor.payment.cinetpay.notify-url=http://localhost:8081/api/paiements/webhook/cinetpay
findoor.payment.cinetpay.return-url=http://localhost:4200/proprietaire/annonces
