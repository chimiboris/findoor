spring:
  application:
    name: mapiol-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/mapiol
    username: mapiol
    password: mapiol
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Le mail (MailHog en dev, cf. docker-compose.yml) est optionnel : son indisponibilité
    # ne doit pas faire tomber la santé globale de l'application.
    mail:
      enabled: false

mapiol:
  jwt:
    # Clé de développement uniquement — remplacée par une variable d'environnement en production.
    secret: "dev-only-change-me-mapiol-secret-key-please-override-in-env-min-32-bytes"
    access-token-minutes: 30
    refresh-token-days: 14
  cors:
    allowed-origins: "http://localhost:4200"
  storage:
    endpoint: http://localhost:9000
    bucket: mapiol-media
    access-key: minioadmin
    secret-key: minioadmin
  payment:
    provider: cinetpay
    cinetpay:
      site-id: CHANGE_ME
      api-key: CHANGE_ME
      notify-url: http://localhost:8081/api/paiements/webhook/cinetpay
      return-url: http://localhost:4200/proprietaire/annonces
